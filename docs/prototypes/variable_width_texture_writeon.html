<script>
(function () {
  const paths = Array.from(document.querySelectorAll('#pen path'));
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const lens = paths.map(p => p.getTotalLength());
  paths.forEach((p,i) => {
    p.style.strokeDasharray = lens[i];
    p.style.strokeDashoffset = reduce ? 0 : lens[i];
  });
  if (reduce) return;
  const PX_PER_SEC = 1100, OVERLAP = 0.2;
  function write() {
    let t = 0;
    paths.forEach((p,i) => {
      const dur = lens[i] / PX_PER_SEC;
      p.style.transition = `stroke-dashoffset ${dur}s ease-in-out`;
      p.style.transitionDelay = `${t}s`;
      requestAnimationFrame(() => p.style.strokeDashoffset = 0);
      t += dur * (1 - OVERLAP);
    });
  }
  new IntersectionObserver((es,obs) => {
    es.forEach(e => { if (e.isIntersecting) { write(); obs.disconnect(); } });
  }, { threshold: 0.4 }).observe(document.querySelector('svg'));
})();
