<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#FAF7F2" />

    <title>%VITE_SHARE_TITLE%</title>
    <meta name="description" content="%VITE_SHARE_DESCRIPTION%" />

    <!-- Open Graph (카카오톡/페이스북 공유 미리보기) -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="%VITE_SHARE_TITLE%" />
    <meta property="og:description" content="%VITE_SHARE_DESCRIPTION%" />
    <meta property="og:image" content="https://teacherchae.github.io/images/share-thumb.jpg" />
    <meta property="og:url" content="https://teacherchae.github.io/" />
    <meta property="og:locale" content="ko_KR" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="%VITE_SHARE_TITLE%" />
    <meta name="twitter:description" content="%VITE_SHARE_DESCRIPTION%" />
    <meta name="twitter:image" content="https://teacherchae.github.io/images/share-thumb.jpg" />

    <link rel="icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Pretendard 다이나믹 서브셋 — 사용된 글자만 다운로드 (대폭 절감) -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.min.css" />

    <!-- 영문 스크립트/세리프/모노 폰트 -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,500;6..96,600&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
