name: Deploy to GitHub Pages
run-name: "Deploy ${{ github.ref_name }}${{ inputs.note && format(' — {0}', inputs.note) || '' }}"

# 자동 배포 OFF. 항상 Actions 탭에서 "Run workflow" 로 브랜치를 골라 수동 실행.
# (이전의 push 트리거는 의도적으로 제거함.)
on:
  workflow_dispatch:
    inputs:
      note:
        description: '메모 (예: layout/ticket 시안 검토). 비워둬도 됨.'
        required: false
        default: ''

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_GROOM_NAME_KO: ${{ vars.VITE_GROOM_NAME_KO }}
          VITE_GROOM_NAME_EN: ${{ vars.VITE_GROOM_NAME_EN }}
          VITE_GROOM_FULL_NAME_EN: ${{ vars.VITE_GROOM_FULL_NAME_EN }}
          VITE_GROOM_FATHER: ${{ vars.VITE_GROOM_FATHER }}
          VITE_GROOM_MOTHER: ${{ vars.VITE_GROOM_MOTHER }}
          VITE_BRIDE_NAME_KO: ${{ vars.VITE_BRIDE_NAME_KO }}
          VITE_BRIDE_NAME_EN: ${{ vars.VITE_BRIDE_NAME_EN }}
          VITE_BRIDE_FULL_NAME_EN: ${{ vars.VITE_BRIDE_FULL_NAME_EN }}
          VITE_BRIDE_FATHER: ${{ vars.VITE_BRIDE_FATHER }}
          VITE_BRIDE_MOTHER: ${{ vars.VITE_BRIDE_MOTHER }}
          VITE_WEDDING_DATE_ISO: ${{ vars.VITE_WEDDING_DATE_ISO }}
          VITE_WEDDING_END_ISO: ${{ vars.VITE_WEDDING_END_ISO }}
          VITE_WEDDING_DAY_KO: ${{ vars.VITE_WEDDING_DAY_KO }}
          VITE_WEDDING_DAY_EN: ${{ vars.VITE_WEDDING_DAY_EN }}
          VITE_WEDDING_DATE_SHORT: ${{ vars.VITE_WEDDING_DATE_SHORT }}
          VITE_WEDDING_TIME: ${{ vars.VITE_WEDDING_TIME }}
          VITE_VENUE_NAME: ${{ vars.VITE_VENUE_NAME }}
          VITE_VENUE_ADDRESS: ${{ vars.VITE_VENUE_ADDRESS }}
          VITE_VENUE_TEL: ${{ vars.VITE_VENUE_TEL }}
          VITE_VENUE_LAT: ${{ vars.VITE_VENUE_LAT }}
          VITE_VENUE_LNG: ${{ vars.VITE_VENUE_LNG }}
          VITE_NAVER_MAP_URL: ${{ vars.VITE_NAVER_MAP_URL }}
          VITE_KAKAO_MAP_URL: ${{ vars.VITE_KAKAO_MAP_URL }}
          VITE_GOOGLE_MAP_URL: ${{ vars.VITE_GOOGLE_MAP_URL }}
          VITE_GROOM_BANK: ${{ vars.VITE_GROOM_BANK }}
          VITE_GROOM_ACCOUNT_NUMBER: ${{ vars.VITE_GROOM_ACCOUNT_NUMBER }}
          VITE_GROOM_ACCOUNT_HOLDER: ${{ vars.VITE_GROOM_ACCOUNT_HOLDER }}
          VITE_BRIDE_BANK: ${{ vars.VITE_BRIDE_BANK }}
          VITE_BRIDE_ACCOUNT_NUMBER: ${{ vars.VITE_BRIDE_ACCOUNT_NUMBER }}
          VITE_BRIDE_ACCOUNT_HOLDER: ${{ vars.VITE_BRIDE_ACCOUNT_HOLDER }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
